version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matchly-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./matchly.db
      - WEIGHT_REQUIRED_SKILLS=0.40
      - WEIGHT_SEMANTIC_SIMILARITY=0.25
      - WEIGHT_EXPERIENCE=0.20
      - WEIGHT_PREFERRED_SKILLS=0.10
      - WEIGHT_EDUCATION=0.05
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchly-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
